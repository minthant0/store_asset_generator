  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = () => resolve(window.JSZip);
    script.onerror = reject;
    document.head.appendChild(script);
  });
};

  const callGemini = async (prompt, imageParts = []) => {
    const key = geminiApiKey.trim();
    if (!key) throw new Error('NO_KEY');
    
    const parts = [];
    if (imageParts && imageParts.length > 0) {
      for (const img of imageParts) {
        if (img.data) {
          parts.push({
            inlineData: {
              mimeType: img.mimeType || 'image/jpeg',
              data: img.data
            }
          });
        }
      }
    }
    parts.push({ text: prompt });

    let activeModel = geminiModel;
    if (activeModel.includes('1.5') || activeModel.includes('2.0')) {
      activeModel = 'gemini-3.6-flash';
    }

    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 3000 }
      })
    });
    let data = await res.json();

    if (data.error && (data.error.message?.includes('not found') || data.error.message?.includes('no longer available'))) {
      const fallback = 'gemini-3.6-flash';
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${fallback}:generateContent?key=${key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 3000 }
        })
      });
      data = await res.json();
      if (!data.error) {
        setGeminiModel(fallback);
        localStorage.setItem('gemini_model', fallback);
      }
    }

    if (data.error) throw new Error(data.error.message || 'Gemini error');
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  };

  const renderScreenToCanvas = (ctx, scr, targetW, targetH) => {
    ctx.clearRect(0, 0, targetW, targetH);

    // 1. BG
    if (scr.bgType === 'solid') {
      ctx.fillStyle = scr.bgColor1;
      ctx.fillRect(0, 0, targetW, targetH);
    } else {
      let grad;
      if (scr.bgAngle === 'horizontal') grad = ctx.createLinearGradient(0, 0, targetW, 0);
      else if (scr.bgAngle === 'vertical') grad = ctx.createLinearGradient(0, 0, 0, targetH);
      else grad = ctx.createLinearGradient(0, 0, targetW, targetH);
      grad.addColorStop(0, scr.bgColor1);
      grad.addColorStop(1, scr.bgColor2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, targetW, targetH);
    }

    const glowGrad = ctx.createRadialGradient(targetW * 0.75, targetH * 0.35, 20, targetW * 0.75, targetH * 0.35, targetW * 0.65);
    glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
    glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, targetW, targetH);

    let textX, textY, deviceX, deviceY, baseDeviceW, textAlign, deviceAngle = 0;
    if (scr.layout === 'stack') {
      textX = targetW / 2; textY = targetH * 0.11; textAlign = 'center';
      deviceX = targetW / 2; deviceY = targetH * 0.65 + (scr.yOffset * 3);
      baseDeviceW = targetW * 0.75 * scr.deviceScale;
    } else if (scr.layout === 'split-left') {
      textX = targetW * 0.92; textY = targetH / 2 - (scr.titleSize * 1.1); textAlign = 'right';
      deviceX = targetW * 0.28; deviceY = targetH / 2 + (scr.yOffset * 2);
      baseDeviceW = targetH * 0.58 * scr.deviceScale;
    } else if (scr.layout === 'split-right') {
      textX = targetW * 0.08; textY = targetH / 2 - (scr.titleSize * 1.1); textAlign = 'left';
      deviceX = targetW * 0.76; deviceY = targetH / 2 + (scr.yOffset * 2);
      baseDeviceW = targetH * 0.60 * scr.deviceScale;
    } else if (scr.layout === 'dual') {
      textX = targetW * 0.08; textY = targetH / 2 - (scr.titleSize * 1.1); textAlign = 'left';
      deviceX = targetW * 0.65; deviceY = targetH / 2 + (scr.yOffset * 2);
      baseDeviceW = targetH * 0.52 * scr.deviceScale;
    } else if (scr.layout === 'hero-float') {
      const isLand = targetW > targetH;
      textX = isLand ? targetW * 0.08 : targetW / 2;
      textY = isLand ? targetH / 2 - (scr.titleSize * 1.1) : targetH * 0.10;
      textAlign = isLand ? 'left' : 'center';
      deviceX = isLand ? targetW * 0.74 : targetW * 0.5;
      deviceY = isLand ? targetH * 0.52 + (scr.yOffset * 2) : targetH * 0.64 + (scr.yOffset * 3);
      baseDeviceW = (isLand ? targetH * 0.65 : targetW * 0.82) * scr.deviceScale;
      deviceAngle = 9;
    } else if (scr.layout === 'isometric') {
      const isLand = targetW > targetH;
      textX = isLand ? targetW * 0.08 : targetW / 2;
      textY = isLand ? targetH / 2 - (scr.titleSize * 1.1) : targetH * 0.09;
      textAlign = isLand ? 'left' : 'center';
      deviceX = isLand ? targetW * 0.75 : targetW * 0.54;
      deviceY = isLand ? targetH * 0.54 + (scr.yOffset * 2) : targetH * 0.63 + (scr.yOffset * 3);
      baseDeviceW = (isLand ? targetH * 0.62 : targetW * 0.76) * scr.deviceScale;
      deviceAngle = -18;
    } else if (scr.layout === 'tilted-cascade') {
      const isLand = targetW > targetH;
      textX = isLand ? targetW * 0.08 : targetW / 2;
      textY = isLand ? targetH / 2 - (scr.titleSize * 1.1) : targetH * 0.09;
      textAlign = isLand ? 'left' : 'center';
      deviceX = isLand ? targetW * 0.82 : targetW * 0.62;
      deviceY = isLand ? targetH * 0.60 + (scr.yOffset * 2) : targetH * 0.68 + (scr.yOffset * 3);
      baseDeviceW = (isLand ? targetH * 0.75 : targetW * 0.90) * scr.deviceScale;
      deviceAngle = 14;
    } else {
      textX = targetW / 2; textY = targetH * 0.10; textAlign = 'center';
      deviceX = targetW / 2; deviceY = targetH * 0.63 + (scr.yOffset * 3);
      baseDeviceW = targetW * 0.82 * scr.deviceScale;
    }

    const drawText = (txt, x, y, size, color, isBold) => {
      if (!txt) return 0;
      ctx.font = `${isBold ? '800' : '500'} ${size}px 'Inter', sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = textAlign;
      ctx.textBaseline = 'top';
      const lines = txt.split(/\r?\n|\\n/);
      lines.forEach((line, i) => {
        ctx.fillText(line, x, y + (i * size * 1.25));
      });
      return lines.length * size * 1.25;
    };

    const titleH = drawText(scr.title, textX, textY, scr.titleSize, scr.titleColor, true);
    drawText(scr.subtitle, textX, textY + titleH + (scr.titleSize * 0.25), scr.subtitleSize, scr.subtitleColor, false);

    const renderDevice = (cx, cy, devW, shotImg, angleDeg = 0) => {
      ctx.save();
      ctx.translate(cx, cy);
      if (angleDeg !== 0) ctx.rotate((angleDeg * Math.PI) / 180);

      const devType = scr.deviceType || 'iphone';

      if (devType === 'none') {
        let devWCustom = devW * 1.08;
        let devH = devWCustom * 2.16;
        if (shotImg) {
          const aspect = shotImg.height / shotImg.width;
          devH = devWCustom * aspect;
        }

      paddingScale = logoScale,
      offsetX = logoOffsetX,
      offsetY = logoOffsetY

    const w = canvasWidth;
    const h = canvasHeight;
    ctx.clearRect(0, 0, w, h);

    ctx.save();

    // 1. Clipping Mask
    if (shape === 'android-round' || shape === 'round') {
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      const radius = w * 0.225; // Standard iOS continuous corner squircle ratio
      ctx.beginPath();

      else ctx.rect(0, 0, w, h);
      ctx.closePath();
      ctx.clip();
    } else if (shape === 'android-squircle' || shape === 'squircle') {
      const radius = w * 0.32; // Android Adaptive / Samsung OneUI squircle ratio
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, w, h, radius);
      else ctx.rect(0, 0, w, h);
      ctx.closePath();
      ctx.clip();
    }

    // 2. Background (skipped for foreground-only)
    if (shape !== 'foreground-only') {
      if (logoBgType === 'gradient') {
        let grad;
        if (logoBgAngle === 'horizontal') grad = ctx.createLinearGradient(0, 0, w, 0);
        else if (logoBgAngle === 'vertical') grad = ctx.createLinearGradient(0, 0, 0, h);

        grad.addColorStop(0, logoBgColor1);

        ctx.fillStyle = grad;

        ctx.fillStyle = logoBgColor1;
      } else {
        ctx.fillStyle = 'transparent';
      }
      ctx.fillRect(0, 0, w, h);

      // Subtle Border
      if (logoBorder) {
        ctx.strokeStyle = logoBorderColor;
        ctx.lineWidth = Math.max(2, w * 0.015);
        ctx.stroke();
      }
    }

    // 3. Foreground Logo Content
    ctx.save();
    if (logoShadow) {
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = w * 0.04;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = w * 0.02;
    }

    const centerX = w / 2 + (offsetX / 100) * (w / 2);
    const centerY = h / 2 + (offsetY / 100) * (h / 2);

    if (logoMode === 'image' && logoImage) {
      const maxDrawW = w * paddingScale;
      const maxDrawH = h * paddingScale;
      const aspect = logoImage.width / logoImage.height;
      let drawW, drawH;
      if (aspect > 1) {
        drawW = maxDrawW;
        drawH = maxDrawW / aspect;
      } else {
        drawH = maxDrawH;
        drawW = maxDrawH * aspect;
      }
      ctx.drawImage(logoImage, centerX - drawW / 2, centerY - drawH / 2, drawW, drawH);
    } else {
      // Text / Monogram typography
      const mainSize = w * 0.32 * paddingScale;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (logoSubText && logoSubText.trim()) {
        ctx.fillStyle = logoTextColor;
        ctx.font = `bold ${mainSize}px ${logoTextFont}`;
        ctx.fillText(logoText, centerX, centerY - mainSize * 0.24);

        ctx.fillStyle = logoSubColor;
        ctx.font = `bold ${mainSize * 0.36}px ${logoTextFont}`;
        ctx.fillText(logoSubText, centerX, centerY + mainSize * 0.48);

        ctx.fillStyle = logoTextColor;
        ctx.font = `bold ${mainSize * 1.3}px ${logoTextFont}`;

    }

  };

        const scr = screens[i];
        const off = document.createElement('canvas');
        off.width = width; off.height = height;
        const ctx = off.getContext('2d');
        renderScreenToCanvas(ctx, scr, width, height);
        const base64 = off.toDataURL('image/png').split(',')[1];
        folder.file(`screen-${i + 1}-${scr.label.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.png`, base64, { base64: true });
      }
      zip.file("store_descriptions.txt", `APP: ${appName}\n\nSHORT DESCRIPTION:\n${shortDescription}\n\nFULL DESCRIPTION:\n${fullDescription}\n\nTARGET DOWNLOAD PATH:\n${downloadPath || 'Default Downloads'}`);
      const blob = await zip.generateAsync({ type: 'blob' });
      const zipName = `store-package-${presetKey}.zip`;

      if (directoryHandle) {
        try {
          const fileHandle = await directoryHandle.getFileHandle(zipName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          setAiToast(`💾 ZIP package saved directly into ${directoryHandle.name}!`);
          setTimeout(() => setAiToast(''), 4000);
          setIsExportingAll(false);
          return;
        } catch (err) {
          console.warn('Direct zip save failed, falling back to download link', err);
        }
      }

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      const folderPrefix = downloadPath ? `${downloadPath.replace(/[^a-z0-9_-]/gi, '_')}_` : '';
      link.download = `${folderPrefix}${zipName}`;
      link.click();
      setAiToast(`📦 Store package downloaded to: ${downloadPath || 'Downloads'}/`);
      setTimeout(() => setAiToast(''), 4000);
    } catch (e) {
      console.error(e);
      setAiToast(`Export error: ${e.message}`);
    }
    setIsExportingAll(false);
  };

              <div className="flex items-center gap-1.5 bg-gray-950/80 px-2.5 py-1 rounded-xl border border-gray-800">
                <span className="text-[11px] text-gray-400 hidden md:inline font-medium">Layout:</span>
                <div className="relative flex items-center">
                  <select
                    value={current.layout}
                    onChange={(e) => updateCurrentScreen({ layout: e.target.value })}
                    className="bg-transparent text-indigo-300 hover:text-white font-medium text-xs rounded-lg pl-1 pr-6 py-0.5 appearance-none focus:outline-none cursor-pointer"
                    title="Change Mockup Layout Composition"
                  >
                    {LAYOUT_COMPOSITIONS.map(comp => (
                      <option key={comp.id} value={comp.id} className="bg-gray-900 text-gray-200">
                        {comp.title} ({comp.tag})
                      </option>
                    ))}
                  </select>
                  <div className="absolute right-0.5 pointer-events-none text-gray-500">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                  </div>
                </div>
              </div>

              <div className="h-4 w-px bg-gray-700 mx-1 hidden sm:block"></div>

              {/* Image Add Function in View Screen Space */}
              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 hover:text-white border border-gray-600 rounded-xl text-xs font-medium transition-all shadow-sm active:scale-95 cursor-pointer"
                title="Add or replace mockup image"
              >
                <IconImage />
                <span>Add Image</span>
              </button>

              <div className="h-4 w-px bg-gray-700 mx-1 hidden sm:block"></div>

              {/* Zoom Controls (Zoom In, Zoom Out, Percentage & Fit) */}
              <div className="flex items-center gap-1 bg-gray-950/80 p-1 rounded-xl border border-gray-800">
                <button
                  type="button"
                  onClick={handleZoomOut}
                  disabled={zoomLevel <= 0.25}
                  className="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 disabled:opacity-30 cursor-pointer transition-colors"
                  title="Zoom Out (-15%)"
                >
                  <IconZoomOut />
                </button>
                <button
                  type="button"
                  onClick={handleResetZoom}
                  className="px-2 py-0.5 text-[11px] font-mono font-medium text-gray-300 hover:text-white rounded hover:bg-gray-800 cursor-pointer"
                  title="Click to Reset Zoom (100%)"
                >
                  {Math.round(zoomLevel * 100)}%
                </button>
                <button
                  type="button"
                  onClick={handleZoomIn}
                  disabled={zoomLevel >= 3.0}
                  className="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 disabled:opacity-30 cursor-pointer transition-colors"
                  title="Zoom In (+15%)"
                >
                  <IconZoomIn />
                </button>
                <button
                  type="button"
                  onClick={handleResetZoom}
                  className="p-1 ml-0.5 rounded-lg text-gray-400 hover:text-indigo-300 hover:bg-gray-800 cursor-pointer transition-colors"
                  title="Fit to Screen / Reset Pan & Zoom"
                >
                  <IconMaximize />
                </button>
              </div>

            </div>

            {/* View Screen Space (Interactive Zoom & Pan Viewport for Mockups) */}
            <div 
              ref={viewContainerRef}
              className={`relative flex-1 w-full flex items-center justify-center overflow-hidden cursor-${isPanning ? 'grabbing' : zoomLevel > 1 ? 'grab' : 'default'}`}
              onWheel={handleWheel}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseUp}
            >
              <div
                style={{
                  transform: `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomLevel})`,
                  transformOrigin: 'center center',
                  transition: isPanning ? 'none' : 'transform 0.1s ease-out'
                }}
                className="relative flex justify-center items-center pointer-events-none select-none"
              >
                <canvas
                  ref={canvasRef}
                  width={width}
                  height={height}
                  className="shadow-2xl shadow-black rounded-lg ring-1 ring-white/10"
                  style={{ maxHeight: 'calc(100vh - 180px)', maxWidth: '100%', objectFit: 'contain' }}
                />
              </div>

              {/* Drag & Drop Visual Overlay */}
              {isDragOverCanvas && (
                <div className="absolute inset-4 bg-blue-950/80 border-2 border-dashed border-blue-500 rounded-2xl flex flex-col items-center justify-center z-30 pointer-events-none backdrop-blur-sm animate-pulse">
                  <div className="p-3.5 bg-blue-600/40 text-blue-100 rounded-full mb-2">
                    <IconUpload />
                  </div>
                  <p className="text-sm font-bold text-white">Drop image here to add to mockup</p>
                  <p className="text-[11px] text-indigo-300 mt-0.5">Supports PNG, JPG, WebP</p>
                </div>
              )}
            </div>

            {/* Bottom Helper Bar for Mockups */}
            <div className="mt-2 text-[11px] text-gray-500 flex flex-wrap items-center justify-center gap-2 md:gap-4 z-10">
              <span>📁 Download Path: <b className="text-gray-400 font-mono">{downloadPath || 'Downloads'}</b></span>
              <span>•</span>
              <span>🔍 Scroll or use <b>+ / -</b> to Zoom ({Math.round(zoomLevel * 100)}%)</span>
              <span>•</span>
              <span>🖱️ Drag to Pan</span>
              <span>•</span>
              <span>📷 Drop image to add</span>
            </div>
          </>
        ) : (
          <>
            {/* Top Control Bar for Logo Studio */}
            <div className="flex flex-wrap items-center justify-center gap-2 md:gap-3 bg-gray-900/90 backdrop-blur-md px-3 md:px-4 py-2 rounded-2xl border border-gray-800 shadow-2xl z-20">
              
              {/* Platform Preview Shape Selector */}
              <div className="flex items-center gap-1 bg-gray-950/80 p-1 rounded-xl border border-gray-800">
                <button
                  type="button"
                  onClick={() => setPreviewShape('ios')}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer transition-all ${
                    previewShape === 'ios'
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-gray-400 hover:text-white hover:bg-gray-800'
                  }`}
                  title="Apple iOS / iPadOS Squircle Preview"
                >
                  <span>🍏</span>
                  <span>iOS</span>
                </button>
                <button
                  type="button"
                  onClick={() => setPreviewShape('android-round')}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer transition-all ${
                    previewShape === 'android-round'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-gray-400 hover:text-white hover:bg-gray-800'
                  }`}
                  title="Google Pixel Adaptive Round Icon Preview"
                >
                  <span>🤖</span>
                  <span>Round</span>
                </button>
                <button
                  type="button"
                  onClick={() => setPreviewShape('android-squircle')}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer transition-all ${
                    previewShape === 'android-squircle'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-gray-400 hover:text-white hover:bg-gray-800'
                  }`}
                  title="Samsung OneUI Adaptive Squircle Preview"
                >
                  <span>📱</span>
                  <span>Samsung</span>
                </button>
                <button
                  type="button"
                  onClick={() => setPreviewShape('flat')}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer transition-all ${
                    previewShape === 'flat'
                      ? 'bg-amber-600 text-white shadow-sm'
                      : 'text-gray-400 hover:text-white hover:bg-gray-800'
                  }`}
                  title="Google Play Store 512×512 Flat Square Preview"
                >
                  <span>⛶</span>
                  <span>Play Store</span>
                </button>
              </div>

              <div className="h-4 w-px bg-gray-700 mx-1 hidden sm:block"></div>

              {/* Bind to Mockups Action Button */}
              <button
                type="button"
                onClick={handleBindLogoToMockups}
                className="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r bg-blue-600 hover:bg-blue-500 hover:to-teal-500 text-white rounded-xl text-xs font-semibold shadow-md active:scale-95 cursor-pointer transition-all"
                title="Bind this logo to your Store Mockups so you can inject it with 1-click"
              >
                <IconCheck />
                <span>Bind to Mockups</span>
              </button>

              {/* Upload Logo Asset Button */}
              <button
                type="button"
                onClick={() => logoFileInputRef.current?.click()}
                className="flex items-center gap-1.5 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 hover:text-white border border-gray-600 rounded-xl text-xs font-medium transition-all shadow-sm active:scale-95 cursor-pointer"
                title="Upload custom logo graphic (PNG, SVG, JPG)"
              >
                <IconUpload />
                <span>Upload Graphic</span>
              </button>

              <div className="h-4 w-px bg-gray-700 mx-1 hidden sm:block"></div>

              {/* Zoom Controls for Logo Studio */}
              <div className="flex items-center gap-1 bg-gray-950/80 p-1 rounded-xl border border-gray-800">
                <button
                  type="button"
                  onClick={handleZoomOut}
                  disabled={zoomLevel <= 0.25}
                  className="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 disabled:opacity-30 cursor-pointer transition-colors"
                  title="Zoom Out (-15%)"
                >
                  <IconZoomOut />
                </button>
                <button
                  type="button"
                  onClick={handleResetZoom}
                  className="px-2 py-0.5 text-[11px] font-mono font-medium text-gray-300 hover:text-white rounded hover:bg-gray-800 cursor-pointer"
                  title="Click to Reset Zoom (100%)"
                >
                  {Math.round(zoomLevel * 100)}%
                </button>
                <button
                  type="button"
                  onClick={handleZoomIn}
                  disabled={zoomLevel >= 3.0}
                  className="p-1 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 disabled:opacity-30 cursor-pointer transition-colors"
                  title="Zoom In (+15%)"
                >
                  <IconZoomIn />
                </button>
                <button
                  type="button"
                  onClick={handleResetZoom}
                  className="p-1 ml-0.5 rounded-lg text-gray-400 hover:text-indigo-300 hover:bg-gray-800 cursor-pointer transition-colors"
                  title="Fit to Screen / Reset Pan & Zoom"
                >
                  <IconMaximize />
                </button>
              </div>

            </div>

            {/* View Screen Space (Interactive Zoom & Pan Viewport for Logo Studio) */}
            <div 
              ref={viewContainerRef}
              className={`relative flex-1 w-full flex items-center justify-center overflow-hidden cursor-${isPanning ? 'grabbing' : zoomLevel > 1 ? 'grab' : 'default'}`}
              onWheel={handleWheel}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseUp}
            >
              <div
                style={{
                  transform: `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomLevel})`,
                  transformOrigin: 'center center',
                  transition: isPanning ? 'none' : 'transform 0.1s ease-out'
                }}
                className="relative flex justify-center items-center pointer-events-none select-none p-8"
              >
                <canvas
                  ref={logoCanvasRef}
                  width={1024}
                  height={1024}
                  className={`shadow-2xl shadow-black ring-1 ring-white/10 ${
                    previewShape === 'ios' ? 'rounded-[22%]' :
                    previewShape === 'android-round' ? 'rounded-full' :
                    previewShape === 'android-squircle' ? 'rounded-[30%]' :
                    'rounded-xl'
                  }`}
                  style={{ 
                    width: '420px', 
                    height: '420px', 
                    maxWidth: '80vw', 
                    maxHeight: 'calc(100vh - 240px)', 
                    objectFit: 'contain' 
                  }}
                />

                {/* If logo mode is image and no image uploaded yet, show overlay button */}
                {logoMode === 'image' && !logoImage && (
                  <button
                    type="button"
                    onClick={() => logoFileInputRef.current?.click()}
                    className="absolute inset-0 m-auto w-48 h-12 flex items-center justify-center gap-2 bg-blue-600/90 hover:bg-blue-500 text-white rounded-xl shadow-2xl backdrop-blur font-medium text-xs border border-blue-400/30 pointer-events-auto cursor-pointer transition-transform hover:scale-105"
                  >
                    <IconUpload />
                    <span>Upload Logo Graphic</span>
                  </button>
                )}
              </div>

              {/* Drag & Drop Visual Overlay for Logo Studio */}
              {isDragOverCanvas && (
                <div className="absolute inset-4 bg-blue-950/80 border-2 border-dashed border-blue-500 rounded-2xl flex flex-col items-center justify-center z-30 pointer-events-none backdrop-blur-sm animate-pulse">
                  <div className="p-3.5 bg-blue-600/40 text-blue-100 rounded-full mb-2">
                    <IconUpload />
                  </div>
                  <p className="text-sm font-bold text-white">Drop logo graphic here</p>
                  <p className="text-[11px] text-indigo-300 mt-0.5">Supports PNG, JPG, SVG, WebP</p>
                </div>
              )}
            </div>

            {/* Bottom Live Preview & Status Bar for Logo Studio */}
            <div className="mt-2 text-[11px] text-gray-400 flex flex-wrap items-center justify-between gap-3 w-full max-w-4xl px-4 py-2 bg-gray-900/70 backdrop-blur rounded-xl border border-gray-800/80 z-10">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-gray-300">Target Preview:</span>
                <span className="px-2 py-0.5 bg-gray-800 text-gray-300 rounded font-mono text-[10px] uppercase font-bold">{previewShape}</span>
                <span className="text-gray-600">|</span>
                <span>1024×1024 Master</span>
              </div>
              
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={handleBindLogoToMockups}
                  className="px-2.5 py-1 bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 border border-blue-500/30 rounded-lg text-xs font-semibold cursor-pointer transition-colors"
                >
                  🔗 Bind to Mockups
                </button>
                <button
                  type="button"
                  onClick={handleExportAppIconsZip}
                  disabled={isExportingIcons}
                  className="px-2.5 py-1 bg-gray-700 hover:bg-gray-600 text-gray-200 border border-gray-600 rounded-lg text-xs font-semibold cursor-pointer transition-colors"
                >
                  {isExportingIcons ? 'Exporting...' : '📦 Export Asset Catalog ZIP'}
                </button>
              </div>

              <div className="flex items-center gap-3 text-gray-500 text-[11px]">
                <span>📁 Path: <b className="text-gray-300 font-mono">{downloadPath || 'Downloads'}</b></span>
                <span>•</span>
                <span>🔍 Zoom {Math.round(zoomLevel * 100)}%</span>
              </div>
            </div>
          </>
        )}

      </div>

    </div>
  );
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
